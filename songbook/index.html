<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3A271E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Three-String Songbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: home = song cards by level. Song = animal band, then one wide horizontal fretboard where note bars scroll right-to-left onto a "now" line, then controls + microphone panel. */
:root{
  --bg:#EEF3F8; --surface:#FFFFFF; --ink:#1D2433; --muted:#5B6577; --line:#D5DEE9;
  --accent:#3B5BDB; --accent-ink:#FFFFFF; --soft:#E3EAF7;
  --s0:#F0643C; --s1:#E9A20B; --s2:#1BA38A; --on-string:#16202E;
  --wood:#4A3328; --wood-2:#3A271E; --fret:#C9CED6; --inlay:#E9DCCB; --hit:#FFFFFF;
  --gold:#F5B400; --good:#1E9E5A; --warn:#C7581E;
  /* animal band (illustration colours, same in both themes) */
  --bear:#8B5A3C; --bear-2:#D9B08C; --cat:#F29E4C; --cat-2:#FFE0BD; --frog:#4FB062; --frog-2:#BDE8A8;
  --bird:#4DA3FF; --bird-2:#CFE6FF; --pink:#F59AB5; --dark:#2A1E1A; --white:#FFFFFF; --brass:#F5C542; --beak:#F5A524; --stick:#E8C08A; --bass:#D64545;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121826; --surface:#1B2335; --ink:#EEF2F8; --muted:#9AA6BA; --line:#2C3850;
  --accent:#7C95FF; --accent-ink:#0F1524; --soft:#243050;
  --s0:#FF7A55; --s1:#FFBE3B; --s2:#33C9AB;
  --wood:#3D2A21; --wood-2:#2A1C15; --fret:#AEB4BE; --inlay:#CDBFAE; --hit:#FFFFFF;
  --good:#3FCF83; --warn:#FF9A5C; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121826; --surface:#1B2335; --ink:#EEF2F8; --muted:#9AA6BA; --line:#2C3850;
  --accent:#7C95FF; --accent-ink:#0F1524; --soft:#243050;
  --s0:#FF7A55; --s1:#FFBE3B; --s2:#33C9AB;
  --wood:#3D2A21; --wood-2:#2A1C15; --fret:#AEB4BE; --inlay:#CDBFAE; --hit:#FFFFFF;
  --good:#3FCF83; --warn:#FF9A5C; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 40px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:600}
button,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,select:focus-visible,.songcard:focus-visible,canvas:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* ---------- Home ---------- */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.hero h1{font-size:clamp(30px,6vw,44px);line-height:1.05}
.hero p{margin:6px 0 0;color:var(--muted);max-width:52ch}
.strings-key{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 10px;border-radius:15px;
  font-family:var(--display);font-weight:600;font-size:15px;color:var(--on-string)}
.chip.s0{background:var(--s0)} .chip.s1{background:var(--s1)} .chip.s2{background:var(--s2)}
.chip.off{background:var(--soft);color:var(--muted)}
.pill-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--surface);
  border:1.5px solid var(--line);font-weight:800;font-size:15px}
.pill-btn:hover{border-color:var(--accent)}
.pill-btn svg{width:18px;height:18px;fill:currentColor}
.level{margin-top:26px}
.level-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.level-head h2{font-size:22px}
.level-head span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.songcard{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;
  display:flex;flex-direction:column;gap:10px;transition:transform .12s,border-color .12s}
.songcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.songcard h3{font-size:20px}
.songcard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.songcard .chips{display:flex;gap:5px}
.songcard .chips .chip{min-width:26px;height:26px;font-size:13px;padding:0 8px}
.songcard .sub{color:var(--muted);font-size:14px}
.stars{display:flex;gap:2px}
.stars svg{width:20px;height:20px}
.star-on{fill:var(--gold)} .star-off{fill:var(--soft)}
.tip{margin-top:30px;background:var(--surface);border:1.5px dashed var(--line);border-radius:18px;padding:16px 18px;color:var(--muted);font-size:15px}
.tip b{color:var(--ink)}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 18px;margin-bottom:6px}
.stats .rank{font-family:var(--display);font-weight:600;font-size:22px}
.stats .lbl{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stats .num{font-family:var(--display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.stats .grow{flex:1;min-width:180px}
.meter{height:12px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--gold);border-radius:6px}

/* ---------- Song view ---------- */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{width:46px;height:46px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.back svg{width:22px;height:22px;stroke:var(--ink)}
.topbar h2{font-size:clamp(22px,4.5vw,30px);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .stars svg{width:22px;height:22px}
.pts{font-family:var(--display);font-weight:600;font-size:16px;background:var(--soft);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums;flex:none;white-space:nowrap}
.pts.bump{animation:bump .35s ease-out}
@keyframes bump{40%{transform:scale(1.18)}}

.board-card{background:var(--wood-2);border-radius:22px;overflow:hidden;margin-bottom:14px}
.board-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px 6px;color:var(--white);flex-wrap:wrap}
.lyric{font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,44px);line-height:1;min-height:1em;min-width:0}
.where{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.where .big{font-family:var(--display);font-weight:600;font-size:clamp(17px,2.8vw,22px)}
.where .small{color:var(--inlay);font-size:14px}
.board-card canvas{display:block;width:100%;height:clamp(210px,34vh,330px);touch-action:manipulation;cursor:pointer}
.feedback{min-height:1.4em;padding:4px 18px 12px;font-weight:800;font-size:16px;color:var(--inlay)}
.feedback.good{color:var(--good)} .feedback.warn{color:var(--warn)}

.panel{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-size:18px}
.shifted{font-size:13px;color:var(--muted);background:var(--soft);border-radius:10px;padding:6px 10px}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;gap:2px;align-self:flex-start}
.seg button{padding:9px 14px;border-radius:999px;font-weight:800;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;font-weight:800;font-size:16px;background:var(--soft);color:var(--ink);white-space:nowrap}
.btn svg{width:20px;height:20px;fill:currentColor}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big{padding:16px 28px;font-size:20px;font-family:var(--display);font-weight:600;justify-content:center}
.btn:disabled{opacity:.45;cursor:default}
.note-text{font-weight:700;font-size:14px;color:var(--muted)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.stepbar{display:flex;gap:10px;align-items:center}
.stepbar .grow{flex:1}

/* microphone */
.mic-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 20px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:19px;background:var(--accent);color:var(--accent-ink)}
.mic-btn svg{width:22px;height:22px;fill:currentColor}
.mic-btn.on{background:var(--soft);color:var(--ink)}
.mic-live{display:flex;align-items:center;gap:12px}
.level{flex:1;height:14px;border-radius:7px;background:var(--soft);overflow:hidden;margin:0}
.level i{display:block;height:100%;width:0;background:var(--good);border-radius:7px;transition:width .06s linear}
.heard{font-family:var(--display);font-weight:600;font-size:24px;min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.mic-msg{font-size:14px;color:var(--muted)}
.mic-msg.err{color:var(--warn);font-weight:700}
.dot-live{width:10px;height:10px;border-radius:50%;background:var(--warn);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}

/* tuner needle */
.needle{position:relative;width:100%;height:44px;border-radius:12px;background:var(--soft);overflow:hidden}
.needle .mid{position:absolute;left:50%;top:6px;bottom:6px;width:3px;margin-left:-1.5px;background:var(--good);border-radius:2px}
.needle .ptr{position:absolute;top:8px;bottom:8px;width:10px;margin-left:-5px;border-radius:5px;background:var(--ink);left:50%;transition:left .1s linear}
.tuner-read{font-family:var(--display);font-weight:600;font-size:20px;min-height:1.4em}
.tuner-read.good{color:var(--good)}

/* animal band */
.band-card{background:linear-gradient(var(--surface),var(--soft));border:1.5px solid var(--line);border-radius:22px;padding:10px 14px 0;margin-bottom:14px;overflow:hidden}
.band-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.band-head h3{font-size:17px}
.band-head span{color:var(--muted);font-size:13px;font-weight:700}
.band svg{display:block;width:100%;height:clamp(100px,13vw,150px)}
.band .tap{cursor:pointer}
.band .idle{animation:breathe 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.band .idle.d2{animation-delay:-.8s} .band .idle.d3{animation-delay:-1.6s} .band .idle.d4{animation-delay:-2.4s}
@keyframes breathe{50%{transform:scale(1.025,.985)}}
.band .mv{transform-box:fill-box;transform-origin:50% 100%}
.band .bop{animation:bop .32s ease-out}
@keyframes bop{35%{transform:translateY(5px)}}
.band .swayL{animation:swayL .55s ease-in-out} .band .swayR{animation:swayR .55s ease-in-out}
@keyframes swayL{50%{transform:rotate(-6deg)}} @keyframes swayR{50%{transform:rotate(6deg)}}
.band .armL{transform-box:fill-box;transform-origin:100% 0%} .band .armR{transform-box:fill-box;transform-origin:0% 100%}
.band .hitL{animation:hitL .2s ease-out} .band .hitR{animation:hitR .2s ease-out}
@keyframes hitL{40%{transform:rotate(-24deg)}} @keyframes hitR{40%{transform:rotate(22deg)}}
.band .hand{transform-box:fill-box;transform-origin:50% 50%}
.band .press{animation:press .25s ease-out}
@keyframes press{40%{transform:translateY(5px)}}
.band .beak-open{opacity:0}
.band .sing{animation:sing .38s ease-out}
@keyframes sing{0%,100%{opacity:0}15%,70%{opacity:1}}
.band .fnote{font-family:var(--display);font-weight:700;font-size:22px;fill:var(--accent);transform-box:fill-box;animation:floatUp 1.3s ease-out forwards}
@keyframes floatUp{from{transform:translate(0,0);opacity:1}to{transform:translate(-22px,-52px);opacity:0}}
.band .jump{animation:jump .5s ease-out 3}
@keyframes jump{40%{transform:translateY(-16px)}}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(10,14,24,.55);display:grid;place-items:center;z-index:50;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border-radius:24px;padding:24px 22px;max-width:460px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;position:relative;overflow:hidden}
.dialog h3{font-size:28px}
.dialog p{margin:0;color:var(--muted)}
.dialog .stars svg{width:44px;height:44px}
.dialog .row{justify-content:center}
.presets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.presets button{padding:8px 14px;border-radius:999px;background:var(--soft);font-weight:800;font-size:14px}
.presets button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tuner{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.tstring{display:flex;flex-direction:column;align-items:center;gap:8px}
.tstring button.play{width:72px;height:72px;border-radius:50%;font-family:var(--display);font-weight:700;font-size:26px;color:var(--on-string)}
.tstring small{font-weight:800;font-size:12px;color:var(--muted)}
.tstring select{border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--surface);font-weight:700}
.confetti{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:0}}
.countin{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:40}
.countin span{font-family:var(--display);font-weight:700;font-size:160px;color:var(--accent);opacity:.9;text-shadow:0 2px 12px rgba(0,0,0,.25)}

@media (max-width:820px){
  .panel{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .card{padding:12px;border-radius:18px}
  .where{align-items:flex-start;text-align:left}
  .seg{align-self:stretch;justify-content:center}
  .seg button{padding:9px 10px;font-size:13px}
  .btn.big{padding:14px 20px;font-size:19px}
  .band-head span{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

<div class="wrap" id="app"></div>

<script>
(function(){
"use strict";

/* ======================= Tuning ======================= */
// Strings are numbered low → high: 0 = thickest, 2 = thinnest.
const STD=[55,59,64];   // G3 B3 E4: the Loog factory tuning (top three strings of a normal guitar)
const PRESETS=[
  {id:"std",  name:"Loog standard (G B E)", notes:[55,59,64]},
  {id:"openG",name:"Open G (G D G)",        notes:[55,62,67]},
  {id:"openA",name:"Open A (A E A)",        notes:[57,64,69]},
  {id:"adg",  name:"A D G",                 notes:[57,62,67]}
];
const NAMES=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
const nm=m=>NAMES[((m%12)+12)%12];
const nmOct=m=>nm(m)+(Math.floor(m/12)-1);
const THICK=["thickest","middle","thinnest"];
const KEY="threeStringSongbook.v1";
let tuning=STD.slice();
try{ const t=JSON.parse(localStorage.getItem(KEY+".tuning")); if(Array.isArray(t)&&t.length===3&&t.every(n=>n>=40&&n<=80)) tuning=t; }catch(e){}
const isStd=()=>tuning.every((n,i)=>n===STD[i]);
const sName=i=>nm(tuning[i]);
const sLabel=i=>{ const n=sName(i); const dup=tuning.filter(x=>nm(x)===n).length>1; return (dup?(i===0?"low ":i===2?"high ":""):"")+n+" string"; };

/* ======================= Songs ======================= */
// Authored for Loog standard tuning: <string G|B|E><fret>[-beats]. "|" = phrase end. Lyrics: one per note.
const SONGS=[
 {id:"choo", title:"Choo-Choo Train", blurb:"Our own warm-up",
  notes:"G0 G0 G2-2 | G0 G0 G2-2 | G0 G2 G4 G2 G0-4",
  lyrics:"Choo choo train, choo choo train, down the track we go!"},
 {id:"buns", title:"Hot Cross Buns", blurb:"Three notes, one string",
  notes:"B3 B1 B0-2 | B3 B1 B0-2 | B0-.5 B0-.5 B0-.5 B0-.5 B1-.5 B1-.5 B1-.5 B1-.5 | B3 B1 B0-2",
  lyrics:"Hot cross buns, hot cross buns, one a pen- ny, two a pen- ny, hot cross buns!"},
 {id:"sun", title:"Sun and Moon", blurb:"Just frets 0 and 3",
  notes:"E3 E0-2 | E3 E3 E0-2 | E3 E3 E0 E0 | E3 E3 E0-2",
  lyrics:"Sun, moon, stars at night, twin- kle twin- kle shi- ning bright!"},
 {id:"rain", title:"Rain, Rain, Go Away", blurb:"Adds a stretch to fret 5",
  notes:"E3 E0 E3 E3 E0-2 | E3 E3 E0 E0 E3 E3 E0-2 | E5 E5 E3 E3 E0 E3 E0-2",
  lyrics:"Rain, rain, go a- way, come a- gain an- oth- er day, lit- tle chil- dren want to play."},
 {id:"mary", title:"Mary Had a Little Lamb", blurb:"Hop between two strings",
  notes:"E0 B3 B1 B3 E0 E0 E0-2 | B3 B3 B3-2 E0 E3 E3-2 | E0 B3 B1 B3 E0 E0 E0 E0 | B3 B3 E0 B3 B1-4",
  lyrics:"Ma- ry had a lit- tle lamb, lit- tle lamb, lit- tle lamb, Ma- ry had a lit- tle lamb, its fleece was white as snow."},
 {id:"ode", title:"Ode to Joy", blurb:"A famous tune by Beethoven",
  notes:"B0 B0 B1 B3 B3 B1 B0 G2 G0 G0 G2 B0 B0-1.5 G2-.5 G2-2 | B0 B0 B1 B3 B3 B1 B0 G2 G0 G0 G2 B0 G2-1.5 G0-.5 G0-2",
  lyrics:""},
 {id:"jingle", title:"Jingle Bells", blurb:"Lots of open B string",
  notes:"B0 B0 B0-2 | B0 B0 B0-2 | B0 B3 G0-1.5 G2-.5 B0-4 | B1 B1 B1-1.5 B1-.5 B1 B0 B0 B0-.5 B0-.5 | B0 G2 G2 B0 G2-2 B3-2 | B0 B0 B0-2 | B0 B0 B0-2 | B0 B3 G0-1.5 G2-.5 B0-4 | B1 B1 B1-1.5 B1-.5 B1 B0 B0 B0-.5 B0-.5 | B3 B3 B1 G2 G0-4",
  lyrics:"Jin- gle bells, jin- gle bells, jin- gle all the way! Oh what fun it is to ride in a one horse o- pen sleigh, hey! Jin- gle bells, jin- gle bells, jin- gle all the way! Oh what fun it is to ride in a one horse o- pen sleigh!"},
 {id:"mountain", title:"In the Hall of the Mountain King", blurb:"Grieg's sneaky tune. Starts slow, then try Fast!",
  notes:"G2-.5 B0-.5 B1-.5 B3-.5 E0-.5 B1-.5 E0 | B4-.5 B0-.5 B4 | B3-.5 G3-.5 B3 | G2-.5 B0-.5 B1-.5 B3-.5 E0-.5 B1-.5 E0-.5 E5-.5 | E3-.5 E0-.5 B1-.5 E0-.5 E3-2 | G2-.5 B0-.5 B1-.5 B3-.5 E0-.5 B1-.5 E0 | B4-.5 B0-.5 B4 | B3-.5 G3-.5 B3 | G2-.5 B0-.5 B1-.5 B3-.5 E0-.5 B1-.5 E0-.5 E5-.5 | E3-2 E5-2",
  lyrics:""},
 {id:"twinkle", title:"Twinkle, Twinkle, Little Star", blurb:"All three strings",
  notes:"G0 G0 B3 B3 E0 E0 B3-2 | B1 B1 B0 B0 G2 G2 G0-2 | B3 B3 B1 B1 B0 B0 G2-2 | B3 B3 B1 B1 B0 B0 G2-2 | G0 G0 B3 B3 E0 E0 B3-2 | B1 B1 B0 B0 G2 G2 G0-2",

        const cur=cands[k].map(c=>{

}

/* ======================= State + routing ======================= */
const view={song:null,mode:"along",idx:0,speed:"slow",band:true,tune:false,playing:false,timers:[],startAt:0,beatSec:1,beat:0,raf:0,
  runPts:0,maxIdx:0,lastBeat:-99,along:false,first:false,waitT:0};
const SPEEDS={slow:{bpm:52,label:"Slow"},medium:{bpm:72,label:"Medium"},fast:{bpm:96,label:"Fast"}};
try{
  const g=localStorage.getItem(KEY+".band"); if(g!=null) view.band=g==="1";
  const tn=localStorage.getItem(KEY+".tune"); if(tn!=null) view.tune=tn==="1";
  const sp=localStorage.getItem(KEY+".speed"); if(SPEEDS[sp]) view.speed=sp;
}catch(e){}

function route(){
  const m=/^#song-([a-z]+)$/.exec(location.hash);
  const song=m&&SONGS.find(s=>s.id===m[1]&&s.ok);
  stopPlay(); closeBoard();
  document.querySelectorAll(".overlay").forEach(o=>o.remove());
  if(song) openSong(song); else renderHome();
}
window.addEventListener("hashchange",route);

/* ======================= Home ======================= */
function renderHome(){
  view.song=null; keepAwake(false);
  const app=$("#app"); app.innerHTML="";
  app.append(
    h("header",{class:"hero"},
      h("div",null,
        h("h1",null,"Three-String Songbook"),
        h("p",null,"Easy songs for a 3-string guitar. Notes slide along the strings to the play line. Turn on listening and the app hears you play.")),
      h("div",{class:"strings-key"},
        ...[0,1,2].map(i=>h("span",{class:"chip s"+i,title:sLabel(i)+" ("+THICK[i]+")"},sName(i))),
        h("button",{class:"pill-btn",onclick:openTuning,html:ICON.guitar+"My guitar &amp; tuner"})))
  );
  const pts=totalPoints(), rk=rankOf(pts);
  const pct=rk.next?Math.round(100*(pts-rk.at)/(rk.next[0]-rk.at)):100;
  app.append(h("section",{class:"stats","aria-label":"Your progress"},
    h("div",{class:"grow"},
      h("div",{class:"lbl"},"Your rank"),
      h("div",{class:"rank"},rk.name),
      h("div",{class:"meter",title:pct+"% of the way"},h("i",{style:"width:"+pct+"%"})),
      h("div",{class:"lbl",style:"margin-top:6px;letter-spacing:0;text-transform:none;font-weight:700"},
        rk.next?(rk.next[0]-pts)+" more points to become a "+rk.next[1]:"Top rank. Amazing!")),
    h("div",null,h("div",{class:"lbl"},"Points"),h("div",{class:"num"},pts.toLocaleString())),
    h("div",null,h("div",{class:"lbl"},"Stars"),h("div",{class:"num"},totalStars()+" / "+SONGS.length*3))));
  const levels=[[1,"One string","Stay on one string the whole time"],[2,"Two strings","Move between two strings"],[3,"All three strings","Use the whole guitar"]];
  for(const [lv,name,desc] of levels){
    const songs=SONGS.filter(s=>s.ok&&s.level===lv); if(!songs.length) continue;
    app.append(h("section",{class:"level"},
      h("div",{class:"level-head"},h("h2",null,name),h("span",null,desc)),
      h("div",{class:"grid"},...songs.map(songCard))));
  }
  app.append(h("div",{class:"tip",html:
    "<b>Stars and points:</b> every song has three stars. Get one in Practice, one in Play along, and one in Play along at Fast speed. "+
    "With listening on, you need to hit at least 6 notes out of every 10 to earn a Play along star. Every note earns points, with bonuses for finishing and for new stars.<br><br>"+
    "<b>How to read it:</b> each coloured line is a string, thickest at the top. Each coloured bar is a note, and a longer bar means a longer note. "+
    "The number is the fret: press just behind that metal bar. <b>0</b> means play the string open, with no finger at all."+
    (isStd()?"":"<br><br><b>Your tuning:</b> "+tuning.map(nmOct).join(" · ")+". The songs have been re-worked to fit it.")}));
}
function songCard(song){
  return h("button",{class:"songcard",onclick:()=>{location.hash="song-"+song.id;}},
    h("h3",null,song.title),
    h("div",{class:"sub"},song.blurb+" · "+song.list.length+" notes"),
    h("div",{class:"meta"},
      h("div",{class:"chips"},...[0,1,2].map(i=>h("span",{class:"chip "+(song.used.includes(i)?"s"+i:"off")},sName(i)))),
      starRow(starsFor(song.id))));

/* ---- tuning + tuner dialog ---- */
function openTuning(){
  const ov=h("div",{class:"overlay",onclick:(e)=>{ if(e.target===ov) close(); }});
  const close=()=>{ ov.remove(); if(!view.song) renderHome(); };
  const body=h("div",{class:"dialog",role:"dialog","aria-modal":"true","aria-label":"My guitar and tuner"});
  function draw(){
    body.innerHTML="";
    const pre=PRESETS.find(p=>p.notes.every((n,i)=>n===tuning[i]));
    body.append(
      h("h3",null,"My guitar"),
      h("p",null,"Loog guitars come tuned G B E. If yours is tuned differently, pick it here and every song is re-worked to fit."),
      h("div",{class:"presets"},...PRESETS.map(p=>h("button",{"aria-pressed":String(pre===p),onclick:()=>{ setTuning(p.notes.slice()); draw(); }},p.name))),
      h("div",{class:"tuner"},...[0,1,2].map(i=>{
        const sel=h("select",{id:"tune"+i,"aria-label":"Note for the "+THICK[i]+" string",onchange:(e)=>{ const t=tuning.slice(); t[i]=+e.target.value; setTuning(t); draw(); }});
        for(let m=48;m<=72;m++) sel.append(h("option",{value:m,selected:m===tuning[i]},nmOct(m)));
        return h("div",{class:"tstring"},
          h("button",{class:"play",style:"background:var(--s"+i+")","aria-label":"Hear the "+THICK[i]+" string",onclick:()=>pluck(tuning[i])},sName(i)),
          h("small",null,THICK[i]), sel);
      })),
      h("p",{style:"font-size:14px"},"Tap a coloured circle to hear a string. Or turn on listening and pluck one string at a time: the tuner tells you which way to turn the peg."),
      h("div",{style:"width:100%;display:flex;flex-direction:column;gap:10px;align-items:center","data-mic-panel":""}),
      h("div",{class:"tuner-read",id:"tunerRead","aria-live":"polite"}),
      h("div",{class:"needle","aria-hidden":"true"},h("span",{class:"mid"}),h("span",{class:"ptr",id:"tunerPtr"})),
      h("button",{class:"btn primary",onclick:close},"Done"));
    body.querySelectorAll("[data-mic-panel]").forEach(renderMicPanel);
    tunerUI();
  }
  draw(); ov.append(body); document.body.append(ov);
}
function tunerUI(){
  const rd=$("#tunerRead"), ptr=$("#tunerPtr"); if(!rd||!ptr) return;
  if(!mic.on||mic.mf==null){ rd.textContent=mic.on?"Pluck one string…":""; rd.className="tuner-read"; ptr.style.left="50%"; return; }
  let best=0; tuning.forEach((t,i)=>{ if(Math.abs(mic.mf-t)<Math.abs(mic.mf-tuning[best])) best=i; });
  const off=mic.mf-tuning[best];
  if(Math.abs(off)>2.5){ rd.textContent="I hear "+nm(mic.midi)+". That's not near any of your strings."; rd.className="tuner-read"; ptr.style.left=(off<0?4:96)+"%"; return; }
  const cents=Math.round(off*100);
  ptr.style.left=Math.max(4,Math.min(96,50+cents/2.2))+"%";
  if(Math.abs(cents)<=8){ rd.textContent=sLabel(best)+": perfect!"; rd.className="tuner-read good"; }
  else rd.textContent=sLabel(best)+(cents<0?": too low, tighten the peg a little":": too high, loosen the peg a little"), rd.className="tuner-read";
}
function setTuning(t){
  tuning=t; try{ localStorage.setItem(KEY+".tuning",JSON.stringify(t)); }catch(e){}
  fitAll();
}

/* ======================= Song view ======================= */
function openSong(song){
  view.song=song; view.idx=0; view.beat=-3; view.runPts=0; view.maxIdx=0; keepAwake(true);
  song.list.forEach(n=>{ n.hit=false; n.miss=false; });
  const app=$("#app"); app.innerHTML="";
  const top=h("div",{class:"topbar"},
    h("button",{class:"back","aria-label":"Back to all songs",onclick:()=>{location.hash="";},html:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>'}),
    h("h2",null,song.title),
    h("span",{id:"songStars"},starRow(starsFor(song.id))),
    h("span",{class:"pts",id:"pts",title:"Points this time"},"0 pts"));
  const bandToggle=h("label",{class:"toggle"},h("input",{type:"checkbox",id:"bandToggle",checked:view.band,onchange:(e)=>{
    view.band=e.target.checked; try{localStorage.setItem(KEY+".band",view.band?"1":"0");}catch(_){}
    if(view.playing){ stopPlay(); startPlay(view.along); } }}),"Band plays along");
  const bandCard=h("section",{class:"band-card"},
    h("div",{class:"band-head"},h("h3",null,"The Woodland Band"),h("span",null,"Bruno on drums, Clem on bass, Ribbit on keys and Pip singing. Tap them!"),bandToggle),
    h("div",{class:"band",id:"band"}));
  buildBand(bandCard.querySelector("#band"));
  const board=h("section",{class:"board-card"},
    h("div",{class:"board-top"},
      h("div",{class:"lyric",id:"lyric"}),
      h("div",{class:"where"},h("div",{class:"big",id:"whereBig"}),h("div",{class:"small",id:"whereSmall"}))),
    h("canvas",{id:"board",tabindex:"0","aria-label":"The fretboard. Coloured bars slide along the strings to the white play line."}),
    h("div",{class:"feedback",id:"feedback","aria-live":"polite"}));
  const ctrlCard=h("section",{class:"card"},
    h("div",{class:"seg",role:"group","aria-label":"How to play"},
      segBtn("along","Play along"),segBtn("practice","Practice"),segBtn("listen","Listen first")),
    h("div",{class:"row",id:"modeExtras"}),
    h("div",{id:"modeMain"}),
    song.shift?h("div",{class:"shifted"},"This song has been moved "+(song.shift>0?"up":"down")+" to fit your tuning, so it sounds a little "+(song.shift>0?"higher":"lower")+" than usual."):null);
  const micCard=h("section",{class:"card"},h("h3",null,"Listening"),h("div",{style:"display:flex;flex-direction:column;gap:10px","data-mic-panel":""}));
  app.append(top,bandCard,board,h("div",{class:"panel"},ctrlCard,micCard));
  renderMicPanel(micCard.querySelector("[data-mic-panel]"));
  renderMode(); update(); setFeedback();
  startBoard();
}
function segBtn(mode,label){
  return h("button",{"aria-pressed":String(view.mode===mode),"data-mode":mode,onclick:()=>setMode(mode)},label);
}
function setMode(mode){
  stopPlay(); view.mode=mode; resetRun();
  document.querySelectorAll(".seg button[data-mode]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mode===mode)));
  renderMode(); update(); setFeedback();
}
function resetRun(){ view.idx=0; view.maxIdx=0; view.song.list.forEach(n=>{ n.hit=false; n.miss=false; }); }
function renderMode(){
  const ex=$("#modeExtras"), main=$("#modeMain"); if(!ex) return; ex.innerHTML=""; main.innerHTML="";
  if(view.mode==="practice"){
    ex.append(h("button",{class:"btn",onclick:hearCurrent,html:ICON.ear+"Hear this note"}));
    main.append(h("div",{class:"stepbar"},
      h("button",{class:"btn big","aria-label":"Previous note",id:"prevBtn",onclick:()=>go(-1,true),html:ICON.prev}),
      h("button",{class:(mic.on?"btn":"btn primary")+" big grow",id:"nextBtn",onclick:()=>go(1,!mic.on),
        html:ICON.next+"<span>"+(mic.on?"Skip this note":"I played it!")+"</span>"})));
    ex.append(h("span",{class:"note-text"},mic.on?"I'll wait until I hear the right note.":"Turn on listening and I'll wait for each note."));
  } else if(view.mode==="along"){
    const sp=h("div",{class:"seg",role:"group","aria-label":"Speed"},
      ...Object.keys(SPEEDS).map(k=>h("button",{"aria-pressed":String(view.speed===k),onclick:(e)=>{
        view.speed=k; try{localStorage.setItem(KEY+".speed",k);}catch(_){}
        e.currentTarget.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed","false"));
        e.currentTarget.setAttribute("aria-pressed","true"); if(view.playing){ stopPlay(); startPlay(true); } }},SPEEDS[k].label)));
    ex.append(sp);
    if(mic.on) ex.append(h("label",{class:"toggle"},h("input",{type:"checkbox",id:"tuneToggle",checked:view.tune,onchange:(e)=>{ view.tune=e.target.checked; try{localStorage.setItem(KEY+".tune",view.tune?"1":"0");}catch(_){} }}),"Play the tune too"));
    else ex.append(h("span",{class:"note-text"},"Each note sounds as it reaches the line."));
    main.append(h("div",{class:"stepbar"},playButton()));
  } else {
    ex.append(h("span",{class:"note-text"},"Watch the notes and listen to how the song goes, then try it yourself."));
    main.append(h("div",{class:"stepbar"},playButton()));
  }
}
function playButton(){
  return h("button",{class:"btn primary big grow",id:"playBtn",onclick:()=>{ view.playing?stopPlay():startPlay(view.mode==="along"); },html:playLabel()});
}
function playLabel(){ return view.playing?ICON.stop+"<span>Stop</span>":ICON.play+"<span>"+(view.mode==="along"?"Start":"Play the song")+"</span>"; }
function setPlayBtn(){ const b=$("#playBtn"); if(b) b.innerHTML=playLabel(); }

      '<ellipse cx="14" cy="112" rx="9" ry="17" fill="var(--bird)" stroke="var(--dark)" stroke-width="1.2" opacity=".9"/>'+
      '<path d="M-2 60 Q2 44 10 50 Q6 56 4 62 Z" fill="var(--bird)"/>'+
      '<circle cx="0" cy="78" r="20" fill="var(--bird)"/>'+
      '<circle cx="-7" cy="74" r="3.5" fill="var(--dark)"/><circle cx="-8" cy="73" r="1.2" fill="var(--white)"/>'+
      '<polygon points="-17,80 -31,84 -17,88" fill="var(--beak)"/>'+
      '<polygon id="beakOpen" class="beak-open" points="-17,77 -33,72 -21,84 -33,95 -17,90" fill="var(--beak)"/>'+
      '<circle cx="-12" cy="88" r="3" fill="var(--pink)" opacity=".7"/>'+
    '</g></g></g>'+
  '</svg>';
  host.querySelectorAll(".tap").forEach(g=>g.addEventListener("click",()=>tapAnimal(g.dataset.who)));
}
function anim(id,cls){ const el=document.getElementById(id); if(!el) return; el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); }
function bandBeat(b){
  const bb=((b-(view.song.pickup||0))%4+4)%4;
  anim(b%2?"armR":"armL",b%2?"hitR":"hitL");
  anim("bearHead","bop");
  if(b>=0){
    if(bb===0||bb===2) anim("kick","bop"); else anim("cym","bop");
    anim("cat",b%2?"swayR":"swayL");
    anim(b%2?"handR":"handL","press"); if(bb===0) anim("frogHead","bop");
  }
}
function birdSing(){
  anim("beakOpen","sing"); anim("bird","bop");
  const g=document.getElementById("birdG"); if(!g||matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const t=document.createElementNS("http://www.w3.org/2000/svg","text");
  t.setAttribute("x",-40+Math.random()*10); t.setAttribute("y",66); t.setAttribute("class","fnote"); t.textContent=Math.random()<.5?"♪":"♫";
  g.appendChild(t); setTimeout(()=>t.remove(),1400);
}
function bandCheer(){ ["bearHead","cat","frogHead","bird"].forEach(id=>anim(id,"jump")); }
function tapAnimal(who){
  const c=audio(); if(!c) return; const t=c.currentTime+0.01;
  mic.ignoreUntil=t+1.2;
  const root=((view.song?view.song.kp+view.song.shift:7)%12+12)%12;
  if(who==="bear"){ kickAt(t); snareAt(t+0.18); hatAt(t+0.36,0.15); anim("armL","hitL"); setTimeout(()=>anim("armR","hitR"),180); anim("kick","bop"); }
  if(who==="cat"){ bassAt(40+((root-4+12)%12),t,0.5); bassAt(47+((root-4+12)%12),t+0.25,0.5); anim("cat","swayL"); }
  if(who==="frog"){ keysAt(keyNotes([root,(root+4)%12,(root+7)%12]),t,0.9); anim("handL","press"); anim("handR","press"); anim("frogHead","bop"); }
  if(who==="bird"){ pluck(tuning[2]+3,t,.7); pluck(tuning[2]+7,t+0.15,.7); birdSing(); }
}

/* ---- text under/over the board ---- */
function update(){
  const song=view.song; if(!song) return;
  const n=song.list[view.idx];
  $("#lyric").textContent=n.lyric||nm(n.m);
  $("#whereBig").innerHTML='<span style="color:var(--s'+n.s+')">'+sLabel(n.s)+'</span> · '+(n.f===0?"open":"fret "+n.f);
  $("#whereSmall").textContent=(n.f===0?"No finger, just pluck":"Press behind fret "+n.f)+" · note "+(view.idx+1)+" of "+song.list.length;
  const pb=$("#prevBtn"); if(pb) pb.disabled=view.idx===0;
}
function setFeedback(text,cls){
  const el=$("#feedback"); if(!el) return;
  if(text==null){
    const n=view.song.list[view.idx];
    if(view.mode==="practice") text=mic.on?"Waiting for you to play "+sLabel(n.s)+", "+(n.f===0?"open":"fret "+n.f)+"…":"Play the note, then tap “I played it!”";
    else if(view.mode==="along") text=view.playing?"":(mic.on?"Press Start. I'll listen for each note.":"Press Start and play along with the band.");
    else text=view.playing?"":"Press Play the song to hear it.";
    cls="";
  }
  el.textContent=text; el.className="feedback"+(cls?" "+cls:"");
}
function hearCurrent(){ const n=view.song.list[view.idx]; pluck(n.m); flash(n.s); }
function go(d,award){
  const song=view.song; if(!song||view.playing||$(".overlay")) return;
  if(d>0&&award) noteDone(view.idx,"step");
  if(d>0&&view.idx===song.list.length-1){ finish("step"); return; }
  view.idx=Math.min(song.list.length-1,Math.max(0,view.idx+d));
  update(); setFeedback();
  if(d>0){ flash(song.list[view.idx].s); birdSing(); }
}
// Points for each note (once per note per run).
function noteDone(i,kind,label){
  if(i<view.maxIdx) return; view.maxIdx=i+1;
  const pts=NOTE_PTS[kind]; addPoints(pts);
  const n=view.song.list[i]; popups.push({lane:n.s,life:1,text:(label?label+" ":"")+"+"+pts});
}

/* ---- what the microphone heard ---- */
const matches=(m,t)=>m===t||m===t+12||m===t-12;
function heard(ev){
  if(!view.song||$(".overlay")) return;
  const song=view.song;
  if(view.mode==="practice"&&!view.playing){
    if(view.advancing) return;
    const n=song.list[view.idx];
    if(matches(ev.midi,n.m)){
      n.hit=true; flash(n.s); birdSing();
      setFeedback(["Yes!","Brilliant!","Spot on!","Great!"][Math.floor(Math.random()*4)],"good");
      noteDone(view.idx,"step","Yes!");
      view.advancing=true;
      view.waitT=setTimeout(()=>{
        view.advancing=false;
        if(view.idx===song.list.length-1){ finish("step"); return; }
        view.idx++; update(); setTimeout(()=>{ if(view.mode==="practice") setFeedback(); },700);
      },160);
    } else {
      const diff=ev.midi-n.m;
      const tip=diff===-1?"Just a little low: try one fret further up.":diff===1?"Just a little high: try one fret lower.":
        "I heard "+nm(ev.midi)+". Try "+sLabel(n.s)+", "+(n.f===0?"open":"fret "+n.f)+".";
      setFeedback(tip,"warn");
    }
  } else if(view.mode==="along"&&view.playing&&view.along){
    const b=(ev.time-view.startAt)/view.beatSec, early=0.2/view.beatSec;
    const k=song.list.findIndex(n=>!n.hit&&!n.miss&&b>=n.start-early&&b<=n.start+Math.max(0.4/view.beatSec,n.beats*0.85)&&matches(ev.midi,n.m));
    if(k>=0){
      const n=song.list[k]; n.hit=true; flash(n.s); birdSing();
      const pts=NOTE_PTS[view.speed]; addPoints(pts);
      popups.push({lane:n.s,life:1,text:"Great! +"+pts});
    }
  }
}

/* ======================= The fretboard (canvas) ======================= */
let cv=null, cx2=null, colors={}, flashes=[0,0,0], lastT=0, ro=null, popups=[];
function readColors(){
  const cs=getComputedStyle(document.documentElement), g=k=>cs.getPropertyValue(k).trim();
  colors={s:[g("--s0"),g("--s1"),g("--s2")],on:g("--on-string"),wood:g("--wood"),wood2:g("--wood-2"),fret:g("--fret"),inlay:g("--inlay"),hit:g("--hit"),gold:g("--gold"),good:g("--good")};
}
function flash(s){ flashes[s]=1; }
function startBoard(){
  cv=$("#board"); cx2=cv.getContext("2d"); readColors(); sizeBoard();
  if(window.ResizeObserver){ ro=new ResizeObserver(sizeBoard); ro.observe(cv); }
  cv.addEventListener("click",()=>{ audio(); if(view.mode==="practice"&&!mic.on) go(1,true); });
  lastT=performance.now(); view.beat=view.song.list[0].start-3;
  const loop=(t)=>{ view.raf=requestAnimationFrame(loop); frame(t); };
  view.raf=requestAnimationFrame(loop);
}
function closeBoard(){ if(view.raf) cancelAnimationFrame(view.raf); view.raf=0; if(ro){ ro.disconnect(); ro=null; } cv=null; clearTimeout(view.waitT); view.advancing=false; }
function sizeBoard(){
  if(!cv) return;
  const r=cv.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
  cx2.setTransform(dpr,0,0,dpr,0,0); cv._w=r.width; cv._h=r.height;
}
const darkMQ=matchMedia("(prefers-color-scheme: dark)");
if(darkMQ.addEventListener) darkMQ.addEventListener("change",readColors);
new MutationObserver(readColors).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
window.addEventListener("resize",()=>{ const b=$("#band"); if(b&&b._nar!==narrow()){ b._nar=narrow(); buildBand(b); } });

function frame(t){
  const song=view.song; if(!song||!cv) return;
  const dt=Math.min(0.1,(t-lastT)/1000); lastT=t;
  if(view.playing&&ctx){
    view.beat=(ctx.currentTime-view.startAt)/view.beatSec;
    const wb=Math.floor(view.beat+0.02);
    if(wb!==view.lastBeat&&view.beat<song.total){ view.lastBeat=wb; if(view.band&&wb>=-4) bandBeat(wb); }
    let i=view.idx;
    while(i+1<song.list.length&&song.list[i+1].start<=view.beat+0.001) i++;
    const listening=view.along&&mic.on;
    const reached=k=>{
      const n=song.list[k];
      if(!listening){ flash(n.s); birdSing(); if(view.along) for(let j=view.maxIdx;j<=k;j++) noteDone(j,view.speed); }
    };
    if(view.beat>=0&&(i!==view.idx||!view.first)){ view.idx=i; view.first=true; update(); reached(i); }
    if(listening){   // notes whose time has passed without being heard
      song.list.forEach(n=>{ if(!n.hit&&!n.miss&&view.beat>n.start+Math.max(0.4/view.beatSec,n.beats*0.85)) n.miss=true; });
    }
  } else {
    const target=song.list[view.idx].start;
    view.beat+=(target-view.beat)*Math.min(1,dt*9);
  }
  draw(dt,t);
}

function rr(c,x,y,w,h,r){ r=Math.min(r,w/2,h/2); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function draw(dt,now){
  const c=cx2, W=cv._w, H=cv._h, song=view.song; if(!W||!H) return;
  const lyrH=38, top=8, headW=Math.max(44,Math.min(64,W*0.08));
  const bot=H-lyrH, sp=(bot-top)/3, y=i=>top+sp*(i+0.5);
  const nowX=headW+Math.max(34,W*0.13);
  const ppb=Math.max(72,Math.min(170,W/6.2));
  const bh=Math.min(38,sp*0.62);
  const cur=view.beat, xb=b=>nowX+(b-cur)*ppb;

  // fretboard wood + headstock
  const g=c.createLinearGradient(0,top,0,bot);
  g.addColorStop(0,colors.wood2); g.addColorStop(.5,colors.wood); g.addColorStop(1,colors.wood2);
  c.fillStyle=colors.wood2; c.fillRect(0,0,W,H);
  c.fillStyle=g; c.fillRect(headW,top,W-headW,bot-top);
  c.fillStyle=colors.inlay; c.fillRect(headW-5,top-2,7,bot-top+4);   // nut

  // beat lines slide past like frets
  c.save(); c.beginPath(); c.rect(headW+2,top,W-headW,bot-top); c.clip();
  for(let b=Math.floor(cur-(nowX-headW)/ppb)-1;b<=Math.ceil(cur+(W-nowX)/ppb)+1;b++){
    if(b<0||b>song.total) continue;
    c.fillStyle=colors.fret; c.globalAlpha=0.32; c.fillRect(xb(b)-1.5,top,3,bot-top);
  }
  c.globalAlpha=0.6; c.fillStyle=colors.inlay;
  song.list.forEach(n=>{ if(n.barAfter){ const x=xb(n.start+n.beats); if(x>headW&&x<W) c.fillRect(x-3,top,6,bot-top); } });
  c.globalAlpha=1;

  // strings
  const widths=[5,4,3];
  for(let i=0;i<3;i++){
    flashes[i]=Math.max(0,flashes[i]-dt*2.2);
    const wob=flashes[i]>0?Math.sin(now/22)*2.4*flashes[i]:0;
    c.strokeStyle=colors.s[i]; c.lineWidth=widths[i]; c.globalAlpha=0.9;
    c.beginPath(); c.moveTo(headW,y(i)); c.quadraticCurveTo((headW+W)/2,y(i)+wob,W,y(i)); c.stroke();
  }
  c.globalAlpha=1;

  // play line + targets (notes are drawn over it, so the fret number stays readable)
  c.fillStyle=colors.hit; c.globalAlpha=0.95; rr(c,nowX-2.5,top,5,bot-top,2.5); c.fill(); c.globalAlpha=1;
  for(let i=0;i<3;i++){
    const f=flashes[i];
    if(f>0){ c.fillStyle=colors.s[i]; c.globalAlpha=0.4*f; c.beginPath(); c.arc(nowX,y(i),bh*0.6+16*f,0,Math.PI*2); c.fill(); c.globalAlpha=1; }
    c.strokeStyle=colors.s[i]; c.lineWidth=3; c.beginPath(); c.arc(nowX,y(i),bh*0.6,0,Math.PI*2); c.stroke();
  }

  // note bars: each bar is as long as the note
  const waiting=view.mode==="practice"&&!view.playing;
  c.textAlign="center"; c.textBaseline="middle";
  for(let k=0;k<song.list.length;k++){
    const n=song.list[k];
    const x0=xb(n.start)+2, x1=xb(n.start+n.beats)-3, w=Math.max(bh,x1-x0);
    if(x0+w<headW-10||x0>W+10) continue;
    const isCur=k===view.idx, yy=y(n.s);
    let a=1;
    if(n.miss) a=0.25; else if(n.start+n.beats<cur-0.02&&!n.hit) a=0.35; else if(n.hit&&!isCur) a=0.55;
    c.globalAlpha=a;
    if(isCur){
      const pulse=waiting?(0.5+0.5*Math.sin(now/220)):1;
      c.fillStyle=colors.hit; c.globalAlpha=a*(0.6+0.4*pulse);
      rr(c,x0-4,yy-bh/2-4,w+8,bh+8,(bh+8)/2); c.fill(); c.globalAlpha=a;
    }
    if(n.hit){ c.fillStyle=colors.gold; rr(c,x0-3,yy-bh/2-3,w+6,bh+6,(bh+6)/2); c.fill(); }
    c.fillStyle=colors.s[n.s]; rr(c,x0,yy-bh/2,w,bh,bh/2); c.fill();
    c.fillStyle=colors.on; c.font="700 "+Math.round(bh*0.66)+"px Fredoka, sans-serif";
    c.fillText(String(n.f),x0+bh/2,yy+1);
  }
  c.restore(); c.globalAlpha=1;

  // headstock with string names (drawn over the clip edge)
  c.fillStyle=colors.wood2; c.fillRect(0,0,headW-5,H);
  for(let i=0;i<3;i++){
    c.fillStyle=colors.s[i]; rr(c,8,y(i)-13,headW-20,26,13); c.fill();
    c.fillStyle=colors.on; c.font="700 15px Fredoka, sans-serif"; c.textAlign="center"; c.fillText(sName(i),8+(headW-20)/2,y(i)+1);
  }

  // words, under each note
  c.textBaseline="middle"; c.textAlign="left";
  c.save(); c.beginPath(); c.rect(headW,bot,W-headW,lyrH); c.clip();
  for(let k=0;k<song.list.length;k++){
    const n=song.list[k], x0=xb(n.start)+2; if(x0>W||x0<headW-120) continue;
    const next=song.list[k+1], room=(next?xb(next.start):W)-x0-4;
    const isCur=k===view.idx;
    c.globalAlpha=isCur?1:(n.start<cur-0.02?0.35:0.75);
    c.fillStyle=isCur?colors.hit:colors.inlay;
    c.font=(isCur?"700 19px ":"600 16px ")+"Fredoka, sans-serif";
    c.fillText(n.lyric||nm(n.m),x0,bot+lyrH/2,Math.max(24,room));
  }
  c.restore(); c.globalAlpha=1;

  // points popping up
  popups=popups.filter(p=>(p.life-=dt*1.0)>0);
  c.textAlign="left";
  popups.forEach(p=>{
    c.globalAlpha=Math.min(1,p.life*1.6); c.fillStyle=colors.gold;
    c.font="700 20px Fredoka, sans-serif";
    c.fillText(p.text,nowX+12,y(p.lane)-bh/2-8-(1-p.life)*40);
  });
  c.globalAlpha=1;
}

/* ---- timed play (play along / listen first) ---- */
function startPlay(along){
  const c=audio(); if(!c) return;
  const song=view.song, bpm=along?SPEEDS[view.speed].bpm:(song.id==="mountain"?100:84), beat=60/bpm;
  resetRun();
  view.playing=true; view.along=along; view.first=false; view.lastBeat=-99; update(); setPlayBtn(); setFeedback("");
  const countBeats=along?4:2;
  const t0=c.currentTime+0.15, startAt=t0+countBeats*beat;
  view.startAt=startAt; view.beatSec=beat;
  for(let i=0;i<countBeats;i++){
    tick(t0+i*beat,i===0);
    if(along) later((t0+i*beat-c.currentTime)*1000,()=>showCount(String(countBeats-i)));
  }
  later((startAt-c.currentTime)*1000,()=>showCount(""));
  if(view.band) scheduleBand(song,startAt,beat);
  else if(along){ for(let b=0;b<Math.ceil(song.total);b++) tick(startAt+b*beat,false); }
  // The tune itself: always in Listen first, and in Play along unless the microphone is listening
  // (then only if she ticks "Play the tune too", because the microphone would hear it).
  const playTune=!along||!mic.on||view.tune;
  if(playTune) song.list.forEach(n=>pluck(n.m,startAt+n.start*beat,along?0.75:0.9));
  const end=startAt+song.total*beat;
  later((end-c.currentTime)*1000+700,()=>{
    view.playing=false; setPlayBtn();
    if(along) finish(view.speed==="fast"?"fast":"along");
    else { view.idx=0; update(); setFeedback(); }
  });
}
function later(ms,fn){ view.timers.push(setTimeout(fn,Math.max(0,ms))); }
function stopPlay(){
  view.timers.forEach(clearTimeout); view.timers=[]; hush(); showCount("");
  if(view.playing){ view.playing=false; setPlayBtn(); if(view.song) setFeedback(); }
}
let countEl=null;
function showCount(txt){
  if(!txt){ if(countEl){ countEl.remove(); countEl=null; } return; }
  if(!countEl){ countEl=h("div",{class:"countin","aria-live":"polite"},h("span")); document.body.append(countEl); }
  countEl.firstChild.textContent=txt;
}

/* ---- finishing a song ---- */
function finish(kind){
  const song=view.song, p=progress[song.id]||(progress[song.id]={});
  const before=starsFor(song.id), rankBefore=rankOf(totalPoints()).name;
  const listened=kind!=="step"&&mic.on;
  const hits=song.list.filter(n=>n.hit).length, total=song.list.length;
  const earned=!listened||hits>=Math.ceil(total*HIT_RATE);
  if(kind==="step") p.step=true;
  if(earned&&kind==="along") p.along=true;
  if(earned&&kind==="fast"){ p.along=true; p.fast=true; }
  saveProgress();
  const after=starsFor(song.id), newStars=after-before;
  const bonus=(kind==="step"?50:kind==="fast"?250:view.speed==="medium"?150:100)*(earned?1:0.5)+newStars*100;
  addPoints(Math.round(bonus));
  const rankNow=rankOf(totalPoints()).name;
  $("#songStars").replaceChildren(starRow(after));
  bandCheer();
  const msg=newStars>0?"You earned a new star!":after===3?"All three stars. You're a rock star!":earned?"Brilliant playing!":
    "Hit "+Math.ceil(total*HIT_RATE)+" notes to earn the star. Try a slower speed or Practice first.";
  const next=!earned?"":!p.step?"Next star: finish it in Practice.":!p.along?"Next star: try Play along.":!p.fast?"Last star: Play along at Fast speed.":"";
  const ov=h("div",{class:"overlay",onclick:(e)=>{ if(e.target===ov) ov.remove(); }});
  const dlg=h("div",{class:"dialog",role:"dialog","aria-modal":"true"},
    h("h3",null,earned?"You played it!":"Good try!"),
    starRow(after),
    h("div",{class:"stats",style:"margin:0;justify-content:center;width:100%"},
      listened?h("div",null,h("div",{class:"lbl"},"Notes hit"),h("div",{class:"num"},hits+" / "+total)):null,
      h("div",null,h("div",{class:"lbl"},"This time"),h("div",{class:"num"},"+"+view.runPts+" pts")),
      h("div",null,h("div",{class:"lbl"},"Total"),h("div",{class:"num"},totalPoints().toLocaleString()))),
    rankNow!==rankBefore?h("p",{style:"color:var(--ink);font-weight:800"},"New rank: "+rankNow+"!"):null,
    h("p",null,msg+(next?" "+next:"")),
    h("div",{class:"row"},
      h("button",{class:"btn",onclick:()=>{ ov.remove(); resetRun(); view.runPts=0; $("#pts").textContent="0 pts"; update(); setFeedback(); },html:ICON.again+"Again"}),
      h("button",{class:"btn primary",onclick:()=>{ ov.remove(); location.hash=""; }},"More songs")));
  ov.append(dlg); document.body.append(ov);
  dlg.querySelector(".btn.primary").focus();
  if(earned&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
    const cols=["var(--s0)","var(--s1)","var(--s2)","var(--accent)","var(--gold)"];
    for(let i=0;i<36;i++) dlg.append(h("i",{class:"confetti",style:"left:"+(Math.random()*100)+"%;background:"+cols[i%5]+";animation-delay:"+(Math.random()*.5).toFixed(2)+"s"}));
  }
  const c=audio(); if(c){ const t=c.currentTime+.05; mic.ignoreUntil=t+1.5; [tuning[0],tuning[1],tuning[2],tuning[2]+3].forEach((m,i)=>pluck(m,t+i*.12,.6)); }
}

/* ---- keyboard ---- */
document.addEventListener("keydown",(e)=>{
  if(e.key==="Escape"){ const ov=$(".overlay"); if(ov){ ov.remove(); if(!view.song) renderHome(); return; } }
  if(!view.song||$(".overlay")) return;
  if(e.target&&(e.target.tagName==="SELECT"||e.target.tagName==="INPUT")) return;
  if(view.mode==="practice"){
    if(e.key===" "||e.key==="ArrowRight"){ e.preventDefault(); go(1,!mic.on); }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); go(-1); }
    else if(e.key==="h"){ hearCurrent(); }
  } else if(e.key===" "){ e.preventDefault(); view.playing?stopPlay():startPlay(view.mode==="along"); }
});

route();
})();
</script>
