<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3A271E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Three-String Songbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: home = song cards by level. Song = animal band, then one wide horizontal fretboard where note bars scroll right-to-left onto a "now" line, then controls + microphone panel. */
:root{
  --bg:#EEF3F8; --surface:#FFFFFF; --ink:#1D2433; --muted:#5B6577; --line:#D5DEE9;
  --accent:#3B5BDB; --accent-ink:#FFFFFF; --soft:#E3EAF7;
  --s0:#F0643C; --s1:#E9A20B; --s2:#1BA38A; --on-string:#16202E;
  --wood:#4A3328; --wood-2:#3A271E; --fret:#C9CED6; --inlay:#E9DCCB; --hit:#FFFFFF;
  --gold:#F5B400; --good:#1E9E5A; --warn:#C7581E;
  /* animal band (illustration colours, same in both themes) */
  --bear:#8B5A3C; --bear-2:#D9B08C; --cat:#F29E4C; --cat-2:#FFE0BD; --frog:#4FB062; --frog-2:#BDE8A8;
  --bird:#4DA3FF; --bird-2:#CFE6FF; --pink:#F59AB5; --dark:#2A1E1A; --white:#FFFFFF; --brass:#F5C542; --beak:#F5A524; --stick:#E8C08A; --bass:#D64545;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121826; --surface:#1B2335; --ink:#EEF2F8; --muted:#9AA6BA; --line:#2C3850;
  --accent:#7C95FF; --accent-ink:#0F1524; --soft:#243050;
  --s0:#FF7A55; --s1:#FFBE3B; --s2:#33C9AB;
  --wood:#3D2A21; --wood-2:#2A1C15; --fret:#AEB4BE; --inlay:#CDBFAE; --hit:#FFFFFF;
  --good:#3FCF83; --warn:#FF9A5C; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121826; --surface:#1B2335; --ink:#EEF2F8; --muted:#9AA6BA; --line:#2C3850;
  --accent:#7C95FF; --accent-ink:#0F1524; --soft:#243050;
  --s0:#FF7A55; --s1:#FFBE3B; --s2:#33C9AB;
  --wood:#3D2A21; --wood-2:#2A1C15; --fret:#AEB4BE; --inlay:#CDBFAE; --hit:#FFFFFF;
  --good:#3FCF83; --warn:#FF9A5C; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 40px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:600}
button,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,select:focus-visible,.songcard:focus-visible,canvas:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* ---------- Home ---------- */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.hero h1{font-size:clamp(30px,6vw,44px);line-height:1.05}
.hero p{margin:6px 0 0;color:var(--muted);max-width:52ch}
.strings-key{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 10px;border-radius:15px;
  font-family:var(--display);font-weight:600;font-size:15px;color:var(--on-string)}
.chip.s0{background:var(--s0)} .chip.s1{background:var(--s1)} .chip.s2{background:var(--s2)}
.chip.off{background:var(--soft);color:var(--muted)}
.pill-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--surface);
  border:1.5px solid var(--line);font-weight:800;font-size:15px}
.pill-btn:hover{border-color:var(--accent)}
.pill-btn svg{width:18px;height:18px;fill:currentColor}
.level{margin-top:26px}
.level-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.level-head h2{font-size:22px}
.level-head span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.songcard{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;
  display:flex;flex-direction:column;gap:10px;transition:transform .12s,border-color .12s}
.songcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.songcard h3{font-size:20px}
.songcard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.songcard .chips{display:flex;gap:5px}
.songcard .chips .chip{min-width:26px;height:26px;font-size:13px;padding:0 8px}
.songcard .sub{color:var(--muted);font-size:14px}
.stars{display:flex;gap:2px}
.stars svg{width:20px;height:20px}
.star-on{fill:var(--gold)} .star-off{fill:var(--soft)}
.tip{margin-top:30px;background:var(--surface);border:1.5px dashed var(--line);border-radius:18px;padding:16px 18px;color:var(--muted);font-size:15px}
.tip b{color:var(--ink)}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 18px;margin-bottom:6px}
.stats .rank{font-family:var(--display);font-weight:600;font-size:22px}
.stats .lbl{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stats .num{font-family:var(--display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.stats .grow{flex:1;min-width:180px}
.meter{height:12px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--gold);border-radius:6px}

/* ---------- Song view ---------- */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{width:46px;height:46px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.back svg{width:22px;height:22px;stroke:var(--ink)}
.topbar h2{font-size:clamp(22px,4.5vw,30px);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .stars svg{width:22px;height:22px}
.pts{font-family:var(--display);font-weight:600;font-size:16px;background:var(--soft);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums;flex:none;white-space:nowrap}
.pts.bump{animation:bump .35s ease-out}
@keyframes bump{40%{transform:scale(1.18)}}

.board-card{background:var(--wood-2);border-radius:22px;overflow:hidden;margin-bottom:14px}
.board-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px 6px;color:var(--white);flex-wrap:wrap}
.lyric{font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,44px);line-height:1;min-height:1em;min-width:0}
.where{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.where .big{font-family:var(--display);font-weight:600;font-size:clamp(17px,2.8vw,22px)}
.where .small{color:var(--inlay);font-size:14px}
.board-card canvas{display:block;width:100%;height:clamp(210px,34vh,330px);touch-action:manipulation;cursor:pointer}
.feedback{min-height:1.4em;padding:4px 18px 12px;font-weight:800;font-size:16px;color:var(--inlay)}
.feedback.good{color:var(--good)} .feedback.warn{color:var(--warn)}

.panel{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-size:18px}
.shifted{font-size:13px;color:var(--muted);background:var(--soft);border-radius:10px;padding:6px 10px}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;gap:2px;align-self:flex-start}
.seg button{padding:9px 14px;border-radius:999px;font-weight:800;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;font-weight:800;font-size:16px;background:var(--soft);color:var(--ink);white-space:nowrap}
.btn svg{width:20px;height:20px;fill:currentColor}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big{padding:16px 28px;font-size:20px;font-family:var(--display);font-weight:600;justify-content:center}
.btn:disabled{opacity:.45;cursor:default}
.note-text{font-weight:700;font-size:14px;color:var(--muted)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.stepbar{display:flex;gap:10px;align-items:center}
.stepbar .grow{flex:1}

/* microphone */
.mic-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 20px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:19px;background:var(--accent);color:var(--accent-ink)}
.mic-btn svg{width:22px;height:22px;fill:currentColor}
.mic-btn.on{background:var(--soft);color:var(--ink)}
.mic-live{display:flex;align-items:center;gap:12px}
.level{flex:1;height:14px;border-radius:7px;background:var(--soft);overflow:hidden;margin:0}
.level i{display:block;height:100%;width:0;background:var(--good);border-radius:7px;transition:width .06s linear}
.heard{font-family:var(--display);font-weight:600;font-size:24px;min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.mic-msg{font-size:14px;color:var(--muted)}
.mic-msg.err{color:var(--warn);font-weight:700}
.dot-live{width:10px;height:10px;border-radius:50%;background:var(--warn);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}

/* tuner needle */
.needle{position:relative;width:100%;height:44px;border-radius:12px;background:var(--soft);overflow:hidden}
.needle .mid{position:absolute;left:50%;top:6px;bottom:6px;width:3px;margin-left:-1.5px;background:var(--good);border-radius:2px}
.needle .ptr{position:absolute;top:8px;bottom:8px;width:10px;margin-left:-5px;border-radius:5px;background:var(--ink);left:50%;transition:left .1s linear}
.tuner-read{font-family:var(--display);font-weight:600;font-size:20px;min-height:1.4em}
.tuner-read.good{color:var(--good)}

/* animal band */
.band-card{background:linear-gradient(var(--surface),var(--soft));border:1.5px solid var(--line);border-radius:22px;padding:10px 14px 0;margin-bottom:14px}
.band-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.band-head h3{font-size:17px}
.band-head span{color:var(--muted);font-size:13px;font-weight:700}
.band{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;--beat:.6s;padding-top:4px}
.bandmate{display:flex;flex-direction:column;align-items:center;padding:0 0 10px;border-radius:16px;min-width:0}
.bandmate .mate-art{display:block;width:100%}
.bandmate svg{display:block;width:100%;height:clamp(92px,14vw,150px);overflow:visible}
.mate-name{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.1}
.mate-part{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bandmate.bop .mate-art{animation:mbop .32s ease-out}
@keyframes mbop{35%{transform:translateY(6px) scale(1.03,.96)}}
.band .fnote{font-family:var(--display);font-weight:700;font-size:30px;fill:var(--accent);transform-box:fill-box;animation:floatUp 1.3s ease-out forwards}
@keyframes floatUp{from{transform:translate(0,0);opacity:1}to{transform:translate(22px,-52px);opacity:0}}
/* Brush Buddies dances (from brush_buddies, keyframes prefixed bb-) */
.animal, .animal * { transform-box: fill-box; }
.animal { transform-origin: 50% 100%; }
.bandmate:not(.dancing) .animal { animation: bb-breathe 2.4s ease-in-out infinite; }
@keyframes bb-breathe { 50% { transform: scale(1.03, .97); } }

.dancing .lion { animation: bb-stomp var(--beat) ease-in-out infinite; }
@keyframes bb-stomp { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-14%) rotate(6deg); } }
.dancing .lion .mane { transform-origin: 50% 50%; animation: bb-spin calc(var(--beat) * 8) linear infinite; }
@keyframes bb-spin { to { transform: rotate(360deg); } }

.dancing .penguin { animation: bb-waddle calc(var(--beat) * 2) ease-in-out infinite; }
@keyframes bb-waddle { 0%,100% { transform: rotate(-12deg) translateX(-6%); } 50% { transform: rotate(12deg) translateX(6%); } }
.dancing .penguin .fl-l, .dancing .shark .fl-l { transform-origin: 80% 0%; animation: bb-flapL var(--beat) ease-in-out infinite; }
.dancing .penguin .fl-r, .dancing .shark .fl-r { transform-origin: 20% 0%; animation: bb-flapR var(--beat) ease-in-out infinite; }
@keyframes bb-flapL { 50% { transform: rotate(40deg); } }
@keyframes bb-flapR { 50% { transform: rotate(-40deg); } }

.dancing .frog, .dancing .bunny { animation: bb-hop var(--beat) cubic-bezier(.3,0,.4,1) infinite; }
@keyframes bb-hop { 0%,100% { transform: translateY(0) scale(1.1, .88); } 45% { transform: translateY(-22%) scale(.94, 1.08); } }
.dancing .frog .pupil { animation: bb-look calc(var(--beat) * 4) steps(1) infinite; }
@keyframes bb-look { 0% { transform: translateX(-30%); } 50% { transform: translateX(30%); } }

.dancing .elephant, .dancing .dragon { animation: bb-sway calc(var(--beat) * 2) ease-in-out infinite; }
@keyframes bb-sway { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
.dancing .elephant .ear-l, .dancing .animal .wing-l { transform-origin: 100% 50%; animation: bb-earL var(--beat) ease-in-out infinite; }
.dancing .elephant .ear-r, .dancing .animal .wing-r { transform-origin: 0% 50%; animation: bb-earR var(--beat) ease-in-out infinite; }
@keyframes bb-earL { 50% { transform: scaleX(.7) rotate(-8deg); } }
@keyframes bb-earR { 50% { transform: scaleX(.7) rotate(8deg); } }
.dancing .elephant .trunk { transform-origin: 30% 0%; animation: bb-trunk calc(var(--beat) * 2) ease-in-out infinite; }
@keyframes bb-trunk { 0%,100% { transform: rotate(18deg); } 50% { transform: rotate(-28deg); } }

.dancing .octopus { animation: bb-float calc(var(--beat) * 2) ease-in-out infinite; }
@keyframes bb-float { 0%,100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-12%) rotate(5deg); } }
.dancing .octopus .tent { transform-origin: 50% 0%; animation: bb-wig var(--beat) ease-in-out infinite; }
.dancing .octopus .tent:nth-child(even) { animation-direction: reverse; }
@keyframes bb-wig { 0%,100% { transform: rotate(-16deg); } 50% { transform: rotate(16deg); } }

.dancing .unicorn { animation: bb-gallop var(--beat) ease-in-out infinite; }
@keyframes bb-gallop { 0%,100% { transform: rotate(-8deg) translateY(0); } 50% { transform: rotate(6deg) translateY(-12%); } }
.dancing .unicorn .horn { animation: bb-glow var(--beat) ease-in-out infinite; }
@keyframes bb-glow { 50% { filter: brightness(1.35) drop-shadow(0 0 6px #FFE27A); } }

.dancing .hobbit { animation: bb-jig var(--beat) ease-in-out infinite; }
@keyframes bb-jig { 0%,100% { transform: translateY(0) rotate(-5deg); } 25%,75% { transform: translateY(-9%) rotate(0); } 50% { transform: translateY(0) rotate(5deg); } }
.dancing .hobbit .foot-l { transform-origin: 90% 100%; animation: bb-tap var(--beat) ease-in-out infinite; }
.dancing .hobbit .foot-r { transform-origin: 10% 100%; animation: bb-tap var(--beat) ease-in-out infinite reverse; }
@keyframes bb-tap { 50% { transform: rotate(-18deg); } }

.dancing .dino { animation: bb-stomp2 calc(var(--beat) * 2) ease-in-out infinite; }
@keyframes bb-stomp2 { 0%,100% { transform: rotate(-5deg); } 25%,75% { transform: translateY(-7%); } 50% { transform: rotate(5deg); } }
.dancing .dino .arm-l, .bandmate.t-clap .dino .arm-l { transform-origin: 100% 0%; animation: bb-flapR calc(var(--beat) / 2) ease-in-out infinite; }
.dancing .dino .arm-r, .bandmate.t-clap .dino .arm-r { transform-origin: 0% 0%; animation: bb-flapL calc(var(--beat) / 2) ease-in-out infinite; }
.bandmate.t-clap .dino .arm-l, .bandmate.t-clap .dino .arm-r { animation-duration: .14s; }

.dancing .monkey { animation: bb-monk calc(var(--beat) * 2) ease-in-out infinite; }
@keyframes bb-monk { 0%,100% { transform: translateX(-9%); } 25%,75% { transform: translateY(-12%); } 50% { transform: translateX(9%); } }

.dancing .bunny .ear-l { transform-origin: 50% 100%; animation: bb-earwig var(--beat) ease-in-out infinite; }
.dancing .bunny .ear-r { transform-origin: 50% 100%; animation: bb-earwig var(--beat) ease-in-out infinite reverse; }
@keyframes bb-earwig { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(10deg); } }

.dancing .robot { animation: bb-robo calc(var(--beat) * 2) steps(1) infinite; }
@keyframes bb-robo { 0% { transform: rotate(-7deg); } 25%,75% { transform: translateY(-6%); } 50% { transform: rotate(7deg); } }
.dancing .robot .light { animation: bb-blink var(--beat) steps(1) infinite; }
.bandmate.t-beep .robot .light { animation: bb-blink .16s steps(1) infinite; }
@keyframes bb-blink { 50% { opacity: .2; } }

.dancing .karl { animation: bb-jig var(--beat) ease-in-out infinite; }
.dancing .bjork { animation: bb-jig var(--beat) ease-in-out infinite; }
@keyframes bb-grump { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-4%); } }
.dancing .mermaid, .dancing .fairy { animation: bb-float calc(var(--beat) * 2) ease-in-out infinite; }
.dancing .shark { animation: bb-sway calc(var(--beat) * 2) ease-in-out infinite; }

/* tricks take over from the dance */
.bandmate.trick .animal, .bandmate.trick .animal .mane, .bandmate.trick .animal .tent, .bandmate.trick .animal .pupil,
.bandmate.trick .animal .fl-l, .bandmate.trick .animal .fl-r, .bandmate.trick .animal .ear-l, .bandmate.trick .animal .ear-r,
.bandmate.trick .animal .trunk, .bandmate.trick .animal .foot-l, .bandmate.trick .animal .foot-r { animation: none; }
.bandmate.t-flyup .animal .wing-l { transform-origin: 100% 50%; animation: bb-earL .18s ease-in-out infinite; }
.bandmate.t-flyup .animal .wing-r { transform-origin: 0% 50%; animation: bb-earR .18s ease-in-out infinite; }
.elephant .trunk { transform-origin: 30% 0%; transition: transform .35s ease; }
.bandmate.t-spray .elephant .trunk { transform: rotate(-125deg); }

.bandmate.t-drums .octopus .tent { transform-origin: 50% 0%; animation: bb-wig .16s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce){ .band .animal, .band .animal *{animation-duration:calc(var(--beat) * 4)!important} }

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(10,14,24,.55);display:grid;place-items:center;z-index:50;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border-radius:24px;padding:24px 22px;max-width:460px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;position:relative;overflow:hidden}
.dialog h3{font-size:28px}
.dialog p{margin:0;color:var(--muted)}
.dialog .stars svg{width:44px;height:44px}
.dialog .row{justify-content:center}
.presets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.presets button{padding:8px 14px;border-radius:999px;background:var(--soft);font-weight:800;font-size:14px}
.presets button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tuner{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.tstring{display:flex;flex-direction:column;align-items:center;gap:8px}
.tstring button.play{width:72px;height:72px;border-radius:50%;font-family:var(--display);font-weight:700;font-size:26px;color:var(--on-string)}
.tstring small{font-weight:800;font-size:12px;color:var(--muted)}
.tstring select{border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--surface);font-weight:700}
.confetti{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}

(function(){

/* ======================= Tuning ======================= */
// Strings are numbered low → high: 0 = thickest, 2 = thinnest.

/* ======================= Songs ======================= */

  notes:"B1 B3 E0 B1 | B1 B3 E0 B1 | E0 E1 E3-2 | E0 E1 E3-2 | E3-.5 E5-.5 E3-.5 E1-.5 E0 B1 | E3-.5 E5-.5 E3-.5 E1-.5 E0 B1 | B1 G0 B1-2 | B1 G0 B1-2",
  lyrics:"Are you sleep- ing, are you sleep- ing, Bro- ther John? Bro- ther John? Morn- ing bells are ring- ing, morn- ing bells are ring- ing, ding, dang, dong! Ding, dang, dong!"}

// Key of each song (pitch class of the home note) so the band can pick chords. pickup = beats before bar 1.
const KEYINFO={choo:{kp:7},buns:{kp:7},sun:{kp:0},rain:{kp:0},mary:{kp:0},ode:{kp:7},jingle:{kp:7},
  mountain:{kp:9,minor:true},twinkle:{kp:7},oldmac:{kp:2},row:{kp:7},birthday:{kp:0,pickup:1},jacques:{kp:0}};
SONGS.forEach(s=>Object.assign(s,{kp:0,minor:false,pickup:0},KEYINFO[s.id]));
const AUTH_IDX={G:0,B:1,E:2};

function parseSong(song){
  const toks=song.notes.trim().split(/\s+/);
  const lyr=song.lyrics?song.lyrics.trim().split(/\s+/):[];
  const notes=[]; let li=0, beat=0;
  for(const t of toks){
    if(t==="|"){ if(notes.length) notes[notes.length-1].barAfter=true; continue; }
    const m=/^([GBE])(\d+)(?:-([\d.]+))?$/.exec(t);
    if(!m) throw new Error("Bad note "+t+" in "+song.id);
    const si=AUTH_IDX[m[1]], f=+m[2];
    const n={as:si, af:f, midi:STD[si]+f, beats:m[3]?parseFloat(m[3]):1, lyric:lyr[li++]||"", start:beat, idx:notes.length};
    beat+=n.beats; notes.push(n);
  }
  song.list=notes; song.total=beat;
}
SONGS.forEach(parseSong);

/* Fit every song to the current tuning: choose string + fret for each note.
   Standard tuning keeps the hand-written fingering. Other tunings: try key shifts,
   then pick the easiest path (low frets, few string jumps). */
function fit(song){
  let best=null;
  if(isStd()){
    song.list.forEach(n=>{ n.s=n.as; n.f=n.af; n.m=n.midi; });
    best={shift:0};
  } else {
    const shifts=[0]; for(let k=1;k<=12;k++){ shifts.push(k,-k); }
    for(const t of shifts){
      const cands=song.list.map(n=>{ const p=n.midi+t, c=[]; for(let i=0;i<3;i++){ const f=p-tuning[i]; if(f>=0&&f<=12) c.push({s:i,f}); } return c; });
      if(cands.some(c=>!c.length)) continue;
      const fc=f=>f===0?0:0.6*f+(f>4?(f-4)*1.4:0);
      let prev=cands[0].map(c=>({cost:fc(c.f),back:-1}));
      const trail=[prev];
      for(let k=1;k<cands.length;k++){
        const cur=cands[k].map(c=>{
          let bc=Infinity,bi=0;
          cands[k-1].forEach((p,j)=>{ const tc=prev[j].cost+1.3*Math.abs(c.s-p.s)+(c.f&&p.f?0.3*Math.abs(c.f-p.f):0); if(tc<bc){bc=tc;bi=j;} });
          return {cost:bc+fc(c.f),back:bi};
        });
        trail.push(cur); prev=cur;
      }
      let end=0; prev.forEach((p,j)=>{ if(p.cost<prev[end].cost) end=j; });
      const score=prev[end].cost/cands.length+0.12*Math.abs(t);
      if(!best||score<best.score){
        const path=[]; let j=end;
        for(let k=cands.length-1;k>=0;k--){ path[k]=cands[k][j]; j=trail[k][j].back; }
        best={score,shift:t,path};
      }
    }
    if(best) song.list.forEach((n,k)=>{ n.s=best.path[k].s; n.f=best.path[k].f; n.m=n.midi+best.shift; });
  }
  song.ok=!!best; song.shift=best?best.shift:0;
  if(!best) return;
  song.used=[0,1,2].filter(i=>song.list.some(n=>n.s===i));
  song.maxFret=Math.max(...song.list.map(n=>n.f));
  song.level=song.used.length;
}
function fitAll(){ SONGS.forEach(fit); }
fitAll();

/* ======================= Progress + points ======================= */
let progress={};
try{ progress=JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ progress={}; }
function saveProgress(){ try{ localStorage.setItem(KEY,JSON.stringify(progress)); }catch(e){} }
function starsFor(id){ const p=progress[id]||{}; return (p.step?1:0)+(p.along?1:0)+(p.fast?1:0); }
const totalStars=()=>SONGS.reduce((a,s)=>a+starsFor(s.id),0);
const totalPoints=()=>progress.__points||0;
const RANKS=[[0,"Sprout Strummer"],[300,"Bedroom Rocker"],[1000,"Garage Band Hero"],[2500,"Stage Star"],[5000,"Rock Legend"],[10000,"Guitar Wizard"]];
function rankOf(p){ let k=0; RANKS.forEach((r,i)=>{ if(p>=r[0]) k=i; }); return {name:RANKS[k][1],at:RANKS[k][0],next:RANKS[k+1]||null}; }
function addPoints(n){
  progress.__points=totalPoints()+n; view.runPts+=n; saveProgress();
  const el=$("#pts"); if(el){ el.textContent=view.runPts+" pts"; el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
}
const NOTE_PTS={step:10,slow:10,medium:15,fast:20};
const HIT_RATE=0.6;   // share of notes she must hit (when listening) to earn a Play-along star

/* ======================= Sound ======================= */
let ctx=null, master=null; const bufCache={}; let live=[];
function audio(){
  if(!ctx){
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
    ctx=new AC(); master=ctx.createGain(); master.gain.value=0.8;
    const lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=3800;
    master.connect(lp); lp.connect(ctx.destination);
  }
  if(ctx.state==="suspended") ctx.resume();
  return ctx;
}
const hz=m=>440*Math.pow(2,(m-69)/12);
function pluckBuffer(fr){   // Karplus–Strong plucked string
  const k=fr.toFixed(2); if(bufCache[k]) return bufCache[k];
  const sr=ctx.sampleRate, len=Math.floor(sr*2.2), N=Math.round(sr/fr);
  const buf=ctx.createBuffer(1,len,sr), d=buf.getChannelData(0);
  for(let i=0;i<N;i++) d[i]=(Math.random()*2-1)*0.6;
  for(let i=N;i<len;i++) d[i]=0.4985*(d[i-N]+d[i-N-1]);
  for(let i=0;i<64;i++) d[i]*=i/64;
  return bufCache[k]=buf;
}
function pluck(m,when,vol){
  const c=audio(); if(!c) return;
  const src=c.createBufferSource(); src.buffer=pluckBuffer(hz(m));
  const g=c.createGain(); g.gain.value=vol==null?0.9:vol;
  src.connect(g); g.connect(master); src.start(when||c.currentTime);
  if(!when) mic.ignoreUntil=c.currentTime+1.1;   // don't mistake our own sound for her playing
  live.push(src); src.onended=()=>{ live=live.filter(x=>x!==src); };
}
function tick(when,accent){
  const c=audio(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.frequency.value=accent?1500:1000;
  g.gain.setValueAtTime(0.0001,when); g.gain.exponentialRampToValueAtTime(accent?0.35:0.2,when+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,when+0.06);
  o.connect(g); g.connect(c.destination); o.start(when); o.stop(when+0.08);
  live.push(o); o.onended=()=>{ live=live.filter(x=>x!==o); };
}
function hush(){ live.forEach(n=>{ try{n.stop();}catch(e){} }); live=[]; }

/* ---- the animal band's instruments ---- */
let bandBus=null, noiseBuf=null;
function bus(){ if(!bandBus){ bandBus=ctx.createGain(); bandBus.connect(ctx.destination); } bandBus.gain.value=mic.on?0.3:0.45; return bandBus; }
function noise(){
  if(!noiseBuf){ const len=Math.floor(ctx.sampleRate*1.2); noiseBuf=ctx.createBuffer(1,len,ctx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; }
  return noiseBuf;
}
function track(n){ live.push(n); n.onended=()=>{ live=live.filter(x=>x!==n); }; }
function kickAt(t){
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+0.12);
  g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
  o.connect(g); g.connect(bus()); o.start(t); o.stop(t+0.32); track(o);
}
function noiseAt(t,freq,type,vol,dur){
  const s=ctx.createBufferSource(); s.buffer=noise();
  const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq;
  const g=ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f); f.connect(g); g.connect(bus()); s.start(t); s.stop(t+dur+0.02); track(s);
}
function toneAt(m,t,dur,type,vol,lp){
  const o=ctx.createOscillator(); o.type=type; o.frequency.value=hz(m);
  const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  let node=o; if(lp){ const f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=lp; o.connect(f); node=f; }
  node.connect(g); g.connect(bus()); o.start(t); o.stop(t+dur+0.05); track(o);
}
const snareAt=t=>{ noiseAt(t,1400,"highpass",0.4,0.16); toneAt(55,t,0.08,"triangle",0.25); };
const hatAt=(t,v)=>noiseAt(t,7000,"highpass",v,0.05);
const crashAt=t=>noiseAt(t,4500,"highpass",0.25,1.1);
const bassAt=(m,t,dur)=>{ toneAt(m,t,dur,"triangle",0.6,900); toneAt(m,t,dur,"sawtooth",0.1,450); };
const keysAt=(ms,t,dur)=>ms.forEach(m=>toneAt(m,t,dur,"triangle",0.08,2200));
// While listening, the bass drops an octave so the microphone isn't fooled by it.
const bassNote=pc=>(mic.on?28:40)+((pc-4+12)%12);
const keyNotes=pcs=>pcs.map(pc=>52+((pc-4+12)%12)).sort((a,b)=>a-b);

/* Pick simple chords (I, IV, V, vi / i, iv, V, VI) to fit each 2-beat chunk of the tune. */
function harmonize(song){
  const root=((song.kp+song.shift)%12+12)%12;
  const set=song.minor?[[0,[0,3,7]],[5,[5,8,0]],[7,[7,11,2]],[8,[8,0,3]]]:[[0,[0,4,7]],[5,[5,9,0]],[7,[7,11,2]],[9,[9,0,4]]];
  const bounds=[0]; let x=song.pickup||2;
  while(x<song.total-0.01){ bounds.push(x); x+=2; }
  bounds.push(song.total);
  const out=[]; let prev=-1;
  for(let i=0;i<bounds.length-1;i++){
    const from=bounds[i], to=bounds[i+1]; let best=0, bs=-1e9;
    set.forEach(([deg,pcs],k)=>{
      const p=pcs.map(q=>(q+root)%12); let s=0;
      song.list.forEach(n=>{
        const ov=Math.min(to,n.start+n.beats)-Math.max(from,n.start); if(ov<=0) return;
        const inC=p.includes(((n.m%12)+12)%12);
        s+=ov*(inC?1:-0.4); if(inC&&Math.abs(n.start-from)<0.01) s+=0.5;
      });
      if(k===0) s+=0.2; if(k===prev) s+=0.1;
      if(i===bounds.length-2&&k===0) s+=100;
      if(s>bs){ bs=s; best=k; }
    });
    prev=best;
    out.push({from,to,root:(root+set[best][0])%12,pcs:set[best][1].map(q=>(q+root)%12)});
  }
  return out;
}
function scheduleBand(song,startAt,beat){
  const ch=harmonize(song), beats=Math.ceil(song.total-0.01);
  for(let b=0;b<beats;b++){
    const t=startAt+b*beat, bb=((b-song.pickup)%4+4)%4;
    if(bb===0||bb===2) kickAt(t); else snareAt(t);
    hatAt(t,0.1); hatAt(t+beat/2,0.06);
    const c=ch.find(c=>b>=c.from-0.001&&b<c.to-0.001)||ch[ch.length-1];
    bassAt(bassNote(c.root)+(b%2?7:0),t,beat*0.85);
    // keyboard chords sit in the guitar's range, so they rest while the microphone is listening
    if(!mic.on&&(bb===0||bb===2||Math.abs(b-c.from)<0.01)) keysAt(keyNotes(c.pcs),t,beat*1.7);
  }
  const end=startAt+song.total*beat;
  kickAt(end); crashAt(end); bassAt(bassNote(ch[ch.length-1].root),end,beat*2);
}

/* ======================= Listening (microphone pitch detection) ======================= */
const mic={on:false,state:"off",stream:null,an:null,buf:null,timer:0,level:0,midi:null,mf:null,
  hist:[],lastOnset:-1,pendingOnset:-1,lastEmit:null,lastEmitAt:-1,stable:null,stableN:0,ignoreUntil:0,lastHeardAt:0};
let yinD=null;
function yin(x,sr){
  const n=x.length; let s=0; for(let i=0;i<n;i++) s+=x[i]*x[i];
  const rms=Math.sqrt(s/n);
  if(rms<0.006) return {rms};
  const minT=Math.floor(sr/1200), maxT=Math.min(Math.floor(sr/95),(n>>1)-1), W=n-maxT;
  if(!yinD||yinD.length<maxT+2) yinD=new Float32Array(maxT+2);
  const d=yinD; d[0]=1; let run=0;
  for(let t=1;t<=maxT;t++){
    let sum=0; for(let j=0;j<W;j++){ const v=x[j]-x[j+t]; sum+=v*v; }
    run+=sum; d[t]=run?sum*t/run:1;
  }
  let tau=-1;
  for(let t=minT;t<=maxT;t++){ if(d[t]<0.15){ while(t+1<=maxT&&d[t+1]<d[t]) t++; tau=t; break; } }
  if(tau<0){
    let b=1,bt=-1; for(let t=minT;t<=maxT;t++) if(d[t]<b){b=d[t];bt=t;}
    if(b>=0.25) return {rms};
    // the deepest dip is often a whole number of periods: prefer the shortest period that is nearly as good
    for(let k=4;k>=2;k--){

    mic.stableN=0;

    const n=song.list[k];
    const x0=xb(n.start)+2, x1=xb(n.start+n.beats)-3, w=Math.max(bh,x1-x0);
    if(x0+w<headW-10||x0>W+10) continue;
    const isCur=k===view.idx, yy=y(n.s);
    let a=1;
    if(n.miss) a=0.25; else if(n.start+n.beats<cur-0.02&&!n.hit) a=0.35; else if(n.hit&&!isCur) a=0.55;
    c.globalAlpha=a;
    if(isCur){
      const pulse=waiting?(0.5+0.5*Math.sin(now/220)):1;
      c.fillStyle=colors.hit; c.globalAlpha=a*(0.6+0.4*pulse);
      rr(c,x0-4,yy-bh/2-4,w+8,bh+8,(bh+8)/2); c.fill(); c.globalAlpha=a;
    }
    if(n.hit){ c.fillStyle=colors.gold; rr(c,x0-3,yy-bh/2-3,w+6,bh+6,(bh+6)/2); c.fill(); }
    c.fillStyle=colors.s[n.s]; rr(c,x0,yy-bh/2,w,bh,bh/2); c.fill();
    c.fillStyle=colors.on; c.font="700 "+Math.round(bh*0.66)+"px Fredoka, sans-serif";
    c.fillText(String(n.f),x0+bh/2,yy+1);
  }
  c.restore(); c.globalAlpha=1;

  // headstock with string names (drawn over the clip edge)
  c.fillStyle=colors.wood2; c.fillRect(0,0,headW-5,H);
  for(let i=0;i<3;i++){
    c.fillStyle=colors.s[i]; rr(c,8,y(i)-13,headW-20,26,13); c.fill();
    c.fillStyle=colors.on; c.font="700 15px Fredoka, sans-serif"; c.textAlign="center"; c.fillText(sName(i),8+(headW-20)/2,y(i)+1);
  }

  // words, under each note
  c.textBaseline="middle"; c.textAlign="left";
  c.save(); c.beginPath(); c.rect(headW,bot,W-headW,lyrH); c.clip();
  for(let k=0;k<song.list.length;k++){
    const n=song.list[k], x0=xb(n.start)+2; if(x0>W||x0<headW-120) continue;
    const next=song.list[k+1], room=(next?xb(next.start):W)-x0-4;
    const isCur=k===view.idx;
    c.globalAlpha=isCur?1:(n.start<cur-0.02?0.35:0.75);
    c.fillStyle=isCur?colors.hit:colors.inlay;
    c.font=(isCur?"700 19px ":"600 16px ")+"Fredoka, sans-serif";
    c.fillText(n.lyric||nm(n.m),x0,bot+lyrH/2,Math.max(24,room));
  }
  c.restore(); c.globalAlpha=1;

  // points popping up
  popups=popups.filter(p=>(p.life-=dt*1.0)>0);
  c.textAlign="left";
  popups.forEach(p=>{
    c.globalAlpha=Math.min(1,p.life*1.6); c.fillStyle=colors.gold;
    c.font="700 20px Fredoka, sans-serif";
    c.fillText(p.text,nowX+12,y(p.lane)-bh/2-8-(1-p.life)*40);
  });
  c.globalAlpha=1;
}

/* ---- timed play (play along / listen first) ---- */
function startPlay(along){
  const c=audio(); if(!c) return;
  const song=view.song, bpm=along?SPEEDS[view.speed].bpm:(song.id==="mountain"?100:84), beat=60/bpm;
  resetRun();
  view.playing=true; view.along=along; view.first=false; view.lastBeat=-99; update(); setPlayBtn(); setFeedback("");
  const countBeats=along?4:2;
  const t0=c.currentTime+0.15, startAt=t0+countBeats*beat;
  view.startAt=startAt; view.beatSec=beat;
  for(let i=0;i<countBeats;i++){
    tick(t0+i*beat,i===0);
    if(along) later((t0+i*beat-c.currentTime)*1000,()=>showCount(String(countBeats-i)));
  }
  later((startAt-c.currentTime)*1000,()=>showCount(""));
  if(view.band) scheduleBand(song,startAt,beat);
  else if(along){ for(let b=0;b<Math.ceil(song.total);b++) tick(startAt+b*beat,false); }
  // The tune itself: always in Listen first, and in Play along unless the microphone is listening
  // (then only if she ticks "Play the tune too", because the microphone would hear it).
  const playTune=!along||!mic.on||view.tune;
  if(playTune) song.list.forEach(n=>pluck(n.m,startAt+n.start*beat,along?0.75:0.9));
  const end=startAt+song.total*beat;
  later((end-c.currentTime)*1000+700,()=>{
    view.playing=false; setPlayBtn();
    if(along) finish(view.speed==="fast"?"fast":"along");
    else { view.idx=0; update(); setFeedback(); }
  });
}
function later(ms,fn){ view.timers.push(setTimeout(fn,Math.max(0,ms))); }
function stopPlay(){
  view.timers.forEach(clearTimeout); view.timers=[]; hush(); showCount("");
  if(view.playing){ view.playing=false; setPlayBtn(); if(view.song) setFeedback(); }
}
let countEl=null;
function showCount(txt){
  if(!txt){ if(countEl){ countEl.remove(); countEl=null; } return; }
  if(!countEl){ countEl=h("div",{class:"countin","aria-live":"polite"},h("span")); document.body.append(countEl); }
  countEl.firstChild.textContent=txt;
}

/* ---- finishing a song ---- */
function finish(kind){
  const song=view.song, p=progress[song.id]||(progress[song.id]={});
  const before=starsFor(song.id), rankBefore=rankOf(totalPoints()).name;
  const listened=kind!=="step"&&mic.on;
  const hits=song.list.filter(n=>n.hit).length, total=song.list.length;
  const earned=!listened||hits>=Math.ceil(total*HIT_RATE);
  if(kind==="step") p.step=true;
  if(earned&&kind==="along") p.along=true;
  if(earned&&kind==="fast"){ p.along=true; p.fast=true; }
  saveProgress();
  const after=starsFor(song.id), newStars=after-before;
  const bonus=(kind==="step"?50:kind==="fast"?250:view.speed==="medium"?150:100)*(earned?1:0.5)+newStars*100;
  addPoints(Math.round(bonus));
  const rankNow=rankOf(totalPoints()).name;
  $("#songStars").replaceChildren(starRow(after));
  bandCheer();
  const msg=newStars>0?"You earned a new star!":after===3?"All three stars. You're a rock star!":earned?"Brilliant playing!":
    "Hit "+Math.ceil(total*HIT_RATE)+" notes to earn the star. Try a slower speed or Practice first.";
  const next=!earned?"":!p.step?"Next star: finish it in Practice.":!p.along?"Next star: try Play along.":!p.fast?"Last star: Play along at Fast speed.":"";
  const ov=h("div",{class:"overlay",onclick:(e)=>{ if(e.target===ov) ov.remove(); }});
  const dlg=h("div",{class:"dialog",role:"dialog","aria-modal":"true"},
    h("h3",null,earned?"You played it!":"Good try!"),
    starRow(after),
    h("div",{class:"stats",style:"margin:0;justify-content:center;width:100%"},
      listened?h("div",null,h("div",{class:"lbl"},"Notes hit"),h("div",{class:"num"},hits+" / "+total)):null,
      h("div",null,h("div",{class:"lbl"},"This time"),h("div",{class:"num"},"+"+view.runPts+" pts")),
      h("div",null,h("div",{class:"lbl"},"Total"),h("div",{class:"num"},totalPoints().toLocaleString()))),
    rankNow!==rankBefore?h("p",{style:"color:var(--ink);font-weight:800"},"New rank: "+rankNow+"!"):null,
    h("p",null,msg+(next?" "+next:"")),
    h("div",{class:"row"},
      h("button",{class:"btn",onclick:()=>{ ov.remove(); resetRun(); view.runPts=0; $("#pts").textContent="0 pts"; update(); setFeedback(); },html:ICON.again+"Again"}),
      h("button",{class:"btn primary",onclick:()=>{ ov.remove(); location.hash=""; }},"More songs")));
  ov.append(dlg); document.body.append(ov);
  dlg.querySelector(".btn.primary").focus();
  if(earned&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
    const cols=["var(--s0)","var(--s1)","var(--s2)","var(--accent)","var(--gold)"];
    for(let i=0;i<36;i++) dlg.append(h("i",{class:"confetti",style:"left:"+(Math.random()*100)+"%;background:"+cols[i%5]+";animation-delay:"+(Math.random()*.5).toFixed(2)+"s"}));
  }
  const c=audio(); if(c){ const t=c.currentTime+.05; mic.ignoreUntil=t+1.5; [tuning[0],tuning[1],tuning[2],tuning[2]+3].forEach((m,i)=>pluck(m,t+i*.12,.6)); }
}

/* ---- keyboard ---- */
document.addEventListener("keydown",(e)=>{
  if(e.key==="Escape"){ const ov=$(".overlay"); if(ov){ ov.remove(); if(!view.song) renderHome(); return; } }
  if(!view.song||$(".overlay")) return;
  if(e.target&&(e.target.tagName==="SELECT"||e.target.tagName==="INPUT")) return;
  if(view.mode==="practice"){
    if(e.key===" "||e.key==="ArrowRight"){ e.preventDefault(); go(1,!mic.on); }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); go(-1); }
    else if(e.key==="h"){ hearCurrent(); }
  } else if(e.key===" "){ e.preventDefault(); view.playing?stopPlay():startPlay(view.mode==="along"); }
});

route();
})();
</script>
